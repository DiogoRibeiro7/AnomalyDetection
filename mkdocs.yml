site_name: AnomalyBench
site_description: Benchmarking suite for anomaly detection algorithms
site_url: https://diogoribeiro7.github.io/anomalybench/
repo_url: https://github.com/DiogoRibeiro7/anomalybench
repo_name: DiogoRibeiro7/anomalybench
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - docs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: install.md
  - Guide:
      - Detectors: guide/detectors.md
      - Running benchmarks: guide/benchmarks.md
      - Metrics: guide/metrics.md
      - Plugins: guide/plugins.md
      - Exceptions: guide/exceptions.md
  - API reference:
      - Detector API: reference/detectors.md
      - Benchmarks: reference/benchmarks.md
      - Exceptions: reference/exceptions.md
  - Development:
      - Contributing: development/contributing.md
      - Releasing: development/releasing.md
