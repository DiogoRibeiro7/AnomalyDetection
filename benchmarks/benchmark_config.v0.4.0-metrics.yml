run_id: v0.4.0-metrics-smoke
random_seed: 42
output_dir: benchmark-results
json_report: benchmark-results/v0.4.0-metrics-report.json
leaderboard: benchmark-results/v0.4.0-metrics-leaderboard.csv
n_jobs: 1
datasets:
  modality: tabular
  task: classification
  limit: 1
metrics:
  include:
    - roc_auc
    - average_precision
    - precision_at_k
    - recall_at_k
    - best_f1
    - runtime
  positive_label: 1
  k: 10
detectors:
  - name: isolation_forest
    params:
      n_estimators: 16
      contamination: 0.1
