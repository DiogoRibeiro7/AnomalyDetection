name: Question / Support
description: Ask for guidance or clarification.
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
      placeholder: How should I configure...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide relevant background, commands, and logs.
      placeholder: I ran `...` and got `...`
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - cli
        - datasets
        - detectors
        - infra
        - docs
    validations:
      required: true
