name: Task
description: Create an implementation task or engineering chore.
title: "[Task]: "
labels:
  - type:improvement
body:
  - type: textarea
    id: summary
    attributes:
      label: Task Summary
      placeholder: Describe what needs to be done.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Explicitly state what is in and out of scope.
      placeholder: |
        In scope:
        - ...
        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Implementation Checklist
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
        - [ ] Step 3
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - cli
        - datasets
        - detectors
        - infra
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
    validations:
      required: true

  - type: dropdown
    id: story_points
    attributes:
      label: Story Points
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
    validations:
      required: true
