name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Validate runtime version
        run: poetry run python -c "from analytics.runtime import ensure_supported_python; ensure_supported_python()"

      - name: Run tests
        run: poetry run pytest -q

  test-streaming-extra:
    runs-on: ubuntu-latest
    needs: test-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies with streaming extra
        run: poetry install --no-interaction -E streaming

      - name: Validate streaming extra import
        run: poetry run python -c "import river; print('river-ok')"

      - name: Streaming detector smoke test
        run: poetry run python -c "import numpy as np; from analytics.detectors.streaming import OnlineIsolationForestDetector; d=OnlineIsolationForestDetector().fit(np.array([[0.0],[1.0],[2.0]])); s=d.score(np.array([[0.5],[1.5]])); assert len(s)==2"
