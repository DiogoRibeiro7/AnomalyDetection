name: Release Please

# Keeps a release pull request open that carries the next version and its
# changelog, both derived from Conventional Commit messages. Merging that pull
# request tags the release and publishes it, which is what Zenodo archives.
#
# Nothing about a release is typed by hand: the version is computed from the
# commits, and it is written into pyproject.toml, .zenodo.json, and
# CITATION.cff together. tests/test_citation_metadata.py still asserts those
# three agree, so a missed file fails CI rather than shipping.

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

# A burst of pushes must not run this twice at once, or it can open duplicate
# release pull requests. Queue rather than cancel, so a run that is mid-release
# is never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: develop

  publish-wheel:
    name: Attach the wheel to the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # release-please tags and publishes but does not build anything, so the
      # wheel that Manual Release used to attach has to be built here or the
      # published release would carry no artifact.
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Build wheel
        run: poetry build -f wheel

      - name: Upload wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG}" dist/*.whl --clobber
