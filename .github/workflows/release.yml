name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.1.1"
        required: true
        type: string
      target:
        description: "Branch, tag, or commit SHA to release"
        required: true
        default: "main"
        type: string
      title:
        description: "Release title. Defaults to v<version>"
        required: false
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean
      draft:
        description: "Create the release as a draft"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 0.1.1, 1.0.0-rc.1, or 1.0.0.post1."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Validate project metadata
        run: poetry check

      - name: Validate citation metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          poetry run python - <<'PY'
          import json
          import os
          import sys

          import yaml

          version = os.environ["VERSION"]
          zenodo = json.load(open(".zenodo.json", encoding="utf-8"))
          citation = yaml.safe_load(open("CITATION.cff", encoding="utf-8"))

          problems = []
          if zenodo.get("version") != version:
              problems.append(f".zenodo.json version is {zenodo.get('version')!r}, expected {version!r}")
          if str(citation.get("version")) != version:
              problems.append(f"CITATION.cff version is {citation.get('version')!r}, expected {version!r}")
          if citation.get("title") != zenodo.get("title"):
              problems.append("CITATION.cff title does not match .zenodo.json title")

          if problems:
              print("Citation metadata is stale; Zenodo would archive the wrong version.")
              for problem in problems:
                  print(f"- {problem}")
              sys.exit(1)

          print(f"Citation metadata is current for {version}.")
          PY

      - name: Validate changelog entry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          poetry run python - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()

          heading = re.search(
              rf"^## v{re.escape(version)} - (.+)$", text, flags=re.MULTILINE
          )
          if heading is None:
              print(f"CHANGELOG.md has no '## v{version} - <date>' section.")
              sys.exit(1)

          date = heading.group(1).strip()
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", date):
              print(
                  f"CHANGELOG.md section for v{version} is dated {date!r}; "
                  "it must be an ISO date. v0.4.0 shipped saying 'Unreleased'."
              )
              sys.exit(1)

          print(f"CHANGELOG.md documents v{version}, dated {date}.")
          PY

      - name: Run tests
        run: poetry run python -m pytest -q

      - name: Build wheel
        run: poetry build -f wheel

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TITLE: ${{ inputs.title }}
          TARGET: ${{ inputs.target }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v${VERSION}"
          TITLE="${RELEASE_TITLE:-${TAG}}"
          NOTES_FILE="$(mktemp)"

          cat > "${NOTES_FILE}" <<EOF
          ## Summary

          Release ${TAG} from ${TARGET}.

          ## Validation

          - \`poetry check\`
          - \`poetry run python -m pytest -q\`
          - \`poetry build -f wheel\`
          EOF

          ARGS=(
            "${TAG}"
            dist/*.whl
            --target "${TARGET}"
            --title "${TITLE}"
            --notes-file "${NOTES_FILE}"
          )

          if [[ "${DRAFT}" == "true" ]]; then
            ARGS+=(--draft)
          fi
          if [[ "${PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; replacing wheel asset."
            gh release upload "${TAG}" dist/*.whl --clobber
          else
            gh release create "${ARGS[@]}"
          fi
