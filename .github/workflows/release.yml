name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.1.1"
        required: true
        type: string
      target:
        description: "Branch, tag, or commit SHA to release"
        required: true
        default: "main"
        type: string
      title:
        description: "Release title. Defaults to v<version>"
        required: false
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean
      draft:
        description: "Create the release as a draft"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 0.1.1, 1.0.0-rc.1, or 1.0.0.post1."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Validate project metadata
        run: poetry check

      - name: Run tests
        run: poetry run python -m pytest -q

      - name: Build wheel
        run: poetry build -f wheel

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TITLE: ${{ inputs.title }}
          TARGET: ${{ inputs.target }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v${VERSION}"
          TITLE="${RELEASE_TITLE:-${TAG}}"
          NOTES_FILE="$(mktemp)"

          cat > "${NOTES_FILE}" <<EOF
          ## Summary

          Release ${TAG} from ${TARGET}.

          ## Validation

          - \`poetry check\`
          - \`poetry run python -m pytest -q\`
          - \`poetry build -f wheel\`
          EOF

          ARGS=(
            "${TAG}"
            dist/*.whl
            --target "${TARGET}"
            --title "${TITLE}"
            --notes-file "${NOTES_FILE}"
          )

          if [[ "${DRAFT}" == "true" ]]; then
            ARGS+=(--draft)
          fi
          if [[ "${PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"
