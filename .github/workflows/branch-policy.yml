name: Branch Policy

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  validate-branch-flow:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce allowed merge flow
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Validating merge flow: ${HEAD_REF} -> ${BASE_REF}"

          if [[ "${BASE_REF}" == "main" ]]; then
            if [[ "${HEAD_REF}" != "develop" ]]; then
              echo "Only 'develop' can be merged into 'main'."
              exit 1
            fi
            exit 0
          fi

          if [[ "${BASE_REF}" == "develop" ]]; then
            echo "Merges into 'develop' are allowed."
            exit 0
          fi

          echo "Unsupported base branch: ${BASE_REF}"
          exit 1
