run_id: v0.3.0-smoke
random_seed: 42
output_dir: benchmark-results
json_report: benchmark-results/v0.3.0-smoke-report.json
leaderboard: benchmark-results/v0.3.0-smoke-leaderboard.csv
n_jobs: 1
datasets:
  - iris
detectors:
  - name: isolation_forest
    params:
      n_estimators: 16
      contamination: 0.1
  - name: kmeans
    params:
      n_clusters: 2
      n_init: 5
