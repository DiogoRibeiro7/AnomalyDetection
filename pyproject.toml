[tool.poetry]
name = "anomaly-detection"
version = "0.1.0"
description = "Simple anomaly detection algorithms and benchmarking utilities."
authors = ["Diogo Ribeiro <diogo.debastos.ribeiro@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
matplotlib = "*"
pandas = "*"
scikit-learn = "*"
scikit-sos = "*"
pyod = "*"
combo = "*"
pyyaml = "*"
networkx = "*"
torch = { version = "*", optional = true }
tensorflow = { version = "*", optional = true }
river = { version = "*", optional = true }
statsmodels = { version = "*", optional = true }
prophet = { version = "*", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "*"
pre-commit = "*"
hypothesis = "*"

[tool.poetry.extras]
deep = ["torch", "tensorflow"]
streaming = ["river"]
forecasting = ["statsmodels", "prophet"]
all-detectors = ["torch", "tensorflow", "river", "statsmodels", "prophet"]

[tool.poetry.scripts]
benchmark-cli = "cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
