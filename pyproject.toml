[project]
name = "anomaly-detection"
version = "0.5.1"
description = "Anomaly detection algorithms and benchmarking utilities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" },
]
keywords = [
  "anomaly-detection",
  "benchmarking",
  "machine-learning",
  "outlier-detection",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "combo",
  "DataExcept>=1.2.0,<2.0.0",
  "matplotlib",
  "networkx",
  "numpy",
  "pandas",
  "pyod",
  "pyyaml",
  "scikit-learn",
  "scikit-sos",
  "scipy",
  "statsmodels",
]

[project.optional-dependencies]
deep = ["torch", "tensorflow"]
streaming = ["river"]
forecasting = ["prophet"]
all-detectors = ["torch", "tensorflow", "river", "prophet"]

[project.scripts]
benchmark-cli = "cli:main"

[tool.poetry]
packages = [
  { include = "analytics" },
  { include = "benchmarks" },
  { include = "industrialstats", from = "src" },
  { include = "cli.py" },
]
include = [
  "benchmarks/*.csv",
  "benchmarks/*.data",
  "benchmarks/*.dat",
  "benchmarks/*.yml",
]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pre-commit = "*"
hypothesis = "*"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Each of these modules must run a guard before the imports it protects:
# a module-level pytest.skip, pytest.importorskip, or
# ensure_supported_python() that turns an unsupported interpreter into a
# clear message instead of an incidental ImportError.
"analytics/benchmark_test.py" = ["E402"]
"benchmarks/load_datasets.py" = ["E402"]
"cli.py" = ["E402"]
"tests/test_deep_early_stopping.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["analytics", "benchmarks"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
